name: Publish Monorepo Packages

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump type'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

# Crucial block: This grants the token generation capability
permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Ensure the runner is using the required version of npm
      - name: Upgrade npm CLI
        run: npm install -g npm@latest

      - name: Install Dependencies
        run: npm ci
      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # Execute Lerna versioning and publishing without tokens
      - name: Publish to npm via Lerna
        run: npx lerna publish ${{ inputs.bump }} --yes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
